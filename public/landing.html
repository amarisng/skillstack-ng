<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillStack NG — Learn Copywriting in 90 Days on WhatsApp</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --g: #075E54;
  --ga: #25D366;
  --gal: #DCF8C6;
  --ink: #0D1C0F;
  --body: #2D3A30;
  --mute: #6B7D6E;
  --rule: #E0E8E1;
  --bg: #FAFCFA;
  --white: #FFFFFF;
  --wa-bg: #E5DDD5;
}

html{scroll-behavior:smooth}

body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.6;
  overflow-x:hidden;
}

nav{
  position:sticky;top:0;z-index:100;
  background:rgba(250,252,250,0.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--rule);
  padding:0 24px;
  height:60px;
  display:flex;align-items:center;justify-content:space-between;
}

.nav-logo{
  font-family:'Bricolage Grotesque',sans-serif;
  font-size:18px;font-weight:800;
  color:var(--g);letter-spacing:-0.01em;
}

.nav-logo span{color:var(--ga)}

.nav-cta{
  background:var(--ga);color:var(--ink);
  font-size:14px;font-weight:700;
  padding:9px 20px;border-radius:100px;
  text-decoration:none;
  transition:transform .15s,box-shadow .15s;
  white-space:nowrap;
}

.nav-cta:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(37,211,102,.3)}

.hero{
  max-width:1200px;margin:0 auto;
  padding:80px 24px 60px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:64px;
  align-items:center;
}

@media(max-width:768px){
  .hero{grid-template-columns:1fr;gap:48px;padding:48px 20px 40px}
  .hero-visual{order:-1}
}

.hero-eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(37,211,102,.1);
  border:1px solid rgba(37,211,102,.25);
  border-radius:100px;
  padding:5px 14px;
  font-size:12px;font-weight:600;
  color:var(--g);letter-spacing:.06em;text-transform:uppercase;
  margin-bottom:20px;
}

.live-dot{
  width:7px;height:7px;background:var(--ga);
  border-radius:50%;
  animation:livepulse 2s infinite;
}

@keyframes livepulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.4;transform:scale(.7)}
}

.hero h1{
  font-family:'Bricolage Grotesque',sans-serif;
  font-size:clamp(36px,5vw,58px);
  font-weight:800;
  line-height:1.08;
  letter-spacing:-.025em;
  color:var(--ink);
  margin-bottom:20px;
}

.hero h1 em{
  font-style:normal;
  color:var(--g);
  position:relative;
}

.hero h1 em::after{
  content:'';
  position:absolute;
  left:0;bottom:-4px;right:0;
  height:3px;
  background:var(--ga);
  border-radius:2px;
}

.hero-sub{
  font-size:17px;color:var(--body);
  line-height:1.7;
  margin-bottom:36px;
  max-width:460px;
}

.hero-actions{
  display:flex;flex-direction:column;gap:12px;
  max-width:400px;
}

.btn-primary{
  display:block;
  background:var(--g);color:#fff;
  font-size:16px;font-weight:700;
  padding:16px 24px;
  border-radius:14px;
  text-decoration:none;
  text-align:center;
  transition:transform .15s,box-shadow .15s;
  letter-spacing:-.01em;
}

.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(7,94,84,.25)}

.btn-secondary{
  display:block;
  background:transparent;color:var(--g);
  border:1.5px solid var(--ga);
  font-size:15px;font-weight:600;
  padding:14px 24px;
  border-radius:14px;
  text-decoration:none;
  text-align:center;
  transition:background .15s;
}

.btn-secondary:hover{background:rgba(37,211,102,.06)}

.hero-trust{
  display:flex;align-items:center;gap:8px;
  margin-top:16px;
  font-size:13px;color:var(--mute);
}

.trust-dot{width:4px;height:4px;background:var(--rule);border-radius:50%}

.hero-visual{display:flex;justify-content:center;align-items:center}

.phone-frame{
  width:280px;
  background:#1a1a1a;
  border-radius:40px;
  padding:10px;
  box-shadow:0 32px 64px rgba(0,0,0,.18),0 0 0 1px rgba(255,255,255,.06);
}

.phone-screen{
  background:var(--wa-bg);
  border-radius:32px;
  overflow:hidden;
  height:540px;
  display:flex;flex-direction:column;
}

.wa-head{
  background:var(--g);
  padding:10px 14px 8px;
  display:flex;align-items:center;gap:10px;
  flex-shrink:0;
}

.wa-av{
  width:34px;height:34px;
  background:var(--ga);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:var(--g);flex-shrink:0;
}

.wa-info{flex:1}
.wa-name{font-size:13px;font-weight:700;color:#fff}
.wa-status{font-size:10px;color:rgba(255,255,255,.7)}

.wa-chat{
  flex:1;overflow:hidden;
  padding:10px 8px;
  display:flex;flex-direction:column;gap:6px;
}

.wa-date{text-align:center;margin:4px 0 6px}
.wa-date span{
  background:rgba(255,255,255,.85);
  color:#667781;font-size:10px;font-weight:500;
  padding:2px 10px;border-radius:8px;
}

.msg{
  display:flex;flex-direction:column;
  max-width:84%;
  opacity:0;transform:translateY(6px);
  transition:opacity .35s ease,transform .35s ease;
}
.msg.show{opacity:1;transform:translateY(0)}
.msg.in{align-self:flex-start}
.msg.out{align-self:flex-end}

.msg-bub{
  padding:7px 9px 5px;
  border-radius:8px;
  font-size:11.5px;
  line-height:1.5;
  color:#111;
  word-break:break-word;
}
.msg.in .msg-bub{background:#fff;border-top-left-radius:2px}
.msg.out .msg-bub{background:var(--gal);border-top-right-radius:2px}

.msg-time{
  font-size:9px;color:#667781;
  text-align:right;margin-top:1px;padding-right:2px;
}
.msg.in .msg-time{text-align:left}

.lesson-card{
  background:#fff;border-radius:8px;border-top-left-radius:2px;
  overflow:hidden;max-width:84%;align-self:flex-start;
  opacity:0;transform:translateY(6px);
  transition:opacity .35s ease,transform .35s ease;
}
.lesson-card.show{opacity:1;transform:translateY(0)}

.lesson-head{background:var(--g);padding:7px 10px}
.lesson-tag{font-size:9px;font-weight:700;color:rgba(255,255,255,.75);text-transform:uppercase;letter-spacing:.05em}
.lesson-title{font-size:11.5px;font-weight:700;color:#fff;margin-top:2px;line-height:1.3}

.lesson-body{padding:7px 10px;font-size:10.5px;line-height:1.55;color:#222}

.lesson-task{
  border-top:1px solid rgba(0,0,0,.08);
  margin-top:5px;padding-top:5px;
  font-size:10px;color:#333;
}
.task-label{font-size:9px;font-weight:700;color:var(--g);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}

.lesson-foot{font-size:9px;color:#667781;text-align:right;padding:3px 10px 5px}

.fb-card{
  background:#fff;border-radius:8px;border-top-left-radius:2px;
  overflow:hidden;max-width:84%;align-self:flex-start;
  opacity:0;transform:translateY(6px);
  transition:opacity .35s ease,transform .35s ease;
}
.fb-card.show{opacity:1;transform:translateY(0)}

.fb-head{background:#128C7E;padding:5px 10px;color:#fff;font-size:10px;font-weight:700}
.fb-body{padding:7px 10px;font-size:10.5px;line-height:1.55;color:#222}
.fb-foot{font-size:9px;color:#667781;text-align:right;padding:3px 10px 5px}

.typing{
  display:flex;align-items:center;gap:4px;
  background:#fff;padding:8px 12px;
  border-radius:8px;border-top-left-radius:2px;
  align-self:flex-start;max-width:60px;
  opacity:0;transition:opacity .2s;
}
.typing.show{opacity:1}
.td{width:6px;height:6px;background:#667781;border-radius:50%;animation:tb 1.2s infinite}
.td:nth-child(2){animation-delay:.2s}
.td:nth-child(3){animation-delay:.4s}
@keyframes tb{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}

.proof-bar{
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  background:var(--white);padding:20px 24px;
  display:flex;align-items:center;justify-content:center;
  gap:40px;flex-wrap:wrap;
}

.proof-item{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);font-weight:500}
.proof-icon{font-size:18px}

.section{max-width:1100px;margin:0 auto;padding:80px 24px}

.section-eyebrow{
  font-size:12px;font-weight:600;color:var(--ga);
  letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px;
}

.section-title{
  font-family:'Bricolage Grotesque',sans-serif;
  font-size:clamp(28px,4vw,44px);font-weight:800;
  line-height:1.12;letter-spacing:-.02em;color:var(--ink);margin-bottom:16px;
}

.section-title span{color:var(--g)}

.section-body{
  font-size:17px;color:var(--body);line-height:1.7;
  max-width:600px;margin-bottom:48px;
}

.problem-section{background:var(--white)}

.problem-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:1px;background:var(--rule);border:1px solid var(--rule);
  border-radius:16px;overflow:hidden;
}

.problem-item{background:var(--white);padding:28px 24px;display:flex;gap:16px}
.problem-icon{font-size:24px;flex-shrink:0;margin-top:2px}

.problem-item h3{
  font-family:'Bricolage Grotesque',sans-serif;
  font-size:16px;font-weight:700;margin-bottom:6px;color:var(--ink);
}

.problem-item p{font-size:14px;color:var(--mute);line-height:1.6}

.steps-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}

.step{
  background:var(--white);border:1px solid var(--rule);
  border-radius:16px;padding:28px 24px;position:relative;
}

.step-num{
  font-family:'Bricolage Grotesque',sans-serif;
  font-size:48px;font-weight:800;color:rgba(37,211,102,.15);
  line-height:1;margin-bottom:12px;letter-spacing:-.03em;
}

.step h3{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;font-weight:700;margin-bottom:8px;color:var(--ink)}
.step p{font-size:14px;color:var(--mute);line-height:1.6}

.curriculum-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:40px}

.week-card{background:var(--white);border:1px solid var(--rule);border-radius:14px;padding:20px}

.week-label{font-size:11px;font-weight:700;color:var(--ga);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}

.week-card h3{font-family:'Bricolage Grotesque',sans-serif;font-size:15px;font-weight:700;color:var(--ink);margin-bottom:8px}

.week-card ul{list-style:none;display:flex;flex-direction:column;gap:4px}

.week-card li{font-size:12.5px;color:var(--mute);display:flex;align-items:flex-start;gap:6px;line-height:1.4}

.week-card li::before{content:'→';color:var(--ga);flex-shrink:0;font-size:11px;margin-top:2px}

.income-section{background:var(--g);padding:80px 24px}
.income-inner{max-width:1100px;margin:0 auto}
.income-section .section-eyebrow{color:var(--ga)}
.income-section .section-title{color:#fff}
.income-section .section-title span{color:var(--ga)}
.income-section .section-body{color:rgba(255,255,255,.65)}

.rates-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}

.rate-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:20px}
.rate-service{font-size:13px;color:rgba(255,255,255,.55);margin-bottom:8px;font-weight:500}
.rate-amount{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:800;color:var(--ga);line-height:1;letter-spacing:-.02em}

.testi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
