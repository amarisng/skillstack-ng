<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're In — SkillStack NG</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #00C48C;
      --green-dark: #009e72;
      --ink: #0D1117;
      --muted: #5A6478;
      --border: #232D3F;
      --card: #141B27;
      --white: #FFFFFF;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--ink);
      color: var(--white);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }
    #confetti-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .hero {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 680px;
      padding: 72px 24px 48px;
      text-align: center;
    }
    .check-ring {
      width: 88px; height: 88px;
      border-radius: 50%;
      background: rgba(0,196,140,0.12);
      border: 2px solid var(--green);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 28px;
      animation: pop 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    .check-ring svg { width: 40px; height: 40px; }
    @keyframes pop {
      from { transform: scale(0.4); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    .eyebrow {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--green);
      margin-bottom: 16px;
    }
    .hero h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2rem, 8vw, 3.2rem);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 20px;
    }
    .hero h1 span { color: var(--green); }
    .hero p {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #A8B4C8;
      max-width: 500px;
      margin: 0 auto 40px;
    }
    .wa-card {
      position: relative;
      z-index: 1;
      width: calc(100% - 48px);
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 28px;
      margin: 0 auto 40px;
      text-align: left;
    }
    .wa-card-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }
    .wa-icon {
      width: 48px; height: 48px;
      border-radius: 14px;
      background: #25D366;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .wa-icon svg { width: 26px; height: 26px; }
    .wa-card-header h2 { font-size: 1.15rem; font-weight: 700; }
    .wa-card-header p { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }
    .steps {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .steps li {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      font-size: 0.9rem;
      color: #A8B4C8;
      line-height: 1.5;
    }
    .step-num {
      width: 26px; height: 26px;
      border-radius: 50%;
      background: rgba(0,196,140,0.15);
      color: var(--green);
      font-weight: 700;
      font-size: 0.75rem;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .steps li strong { color: var(--white); }
    .wa-number {
      margin-top: 24px;
      background: rgba(0,196,140,0.08);
      border: 1px solid rgba(0,196,140,0.25);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .wa-number span {
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--green);
    }
    .copy-btn {
      background: var(--green);
      color: var(--ink);
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .copy-btn:hover { background: var(--green-dark); }
    .copy-btn.copied { background: #2ecc71; }
    .next-section {
      position: relative;
      z-index: 1;
      width: calc(100% - 48px);
      max-width: 560px;
      margin: 0 auto 40px;
    }
    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 20px;
    }
    .tl-item {
      display: flex;
      gap: 20px;
      position: relative;
    }
    .tl-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 32px;
      flex-shrink: 0;
    }
    .tl-dot {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--card);
      border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .tl-dot.active {
      border-color: var(--green);
      background: rgba(0,196,140,0.1);
    }
    .tl-line {
      flex: 1;
      width: 2px;
      background: var(--border);
      margin: 4px 0;
      min-height: 28px;
    }
    .tl-content { padding-bottom: 32px; flex: 1; }
    .tl-content h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 4px; }
    .tl-content p { font-size: 0.85rem; color: var(--muted); line-height: 1.5; }
    .tl-tag {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--green);
      background: rgba(0,196,140,0.1);
      border-radius: 4px;
      padding: 2px 7px;
      margin-bottom: 6px;
    }
    .social-section {
      position: relative;
      z-index: 1;
      width: calc(100% - 48px);
      max-width: 560px;
      margin: 0 auto 64px;
    }
    .social-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .social-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 16px;
      text-align: center;
      text-decoration: none;
      transition: border-color 0.2s, transform 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .social-card:hover { border-color: var(--green); transform: translateY(-3px); }
    .social-icon {
      width: 40px; height: 40px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
    }
    .social-icon.fb { background: #1877F2; }
    .social-icon.tw { background: #000000; }
    .social-icon.ig { background: linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); }
    .social-icon svg { width: 20px; height: 20px; }
    .social-card span { font-size: 0.75rem; font-weight: 600; color: #A8B4C8; }
    .social-card .handle { font-size: 0.7rem; color: var(--muted); }
    footer {
      position: relative;
      z-index: 1;
      width: 100%;
      border-top: 1px solid var(--border);
      padding: 24px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
    }
    footer a { color: var(--green); text-decoration: none; }
    @media (max-width: 480px) {
      .wa-number { flex-direction: column; align-items: flex-start; gap: 10px; }
      .copy-btn { width: 100%; }
    }
